[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emacs-mcp-bridge"
version = "0.1.0"
description = "Local MCP server connecting AI clients to GNU Emacs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.0.0,<2"]
keywords = ["mcp", "emacs", "codex", "claude", "ai"]

[project.scripts]
emacs-mcp-bridge = "emacs_mcp_bridge.server:main"
claude-emacs = "emacs_mcp_bridge.server:main"

[project.urls]
Repository = "https://github.com/rolfmblindgren/emacs-mcp-bridge"

[tool.setuptools]
packages = ["emacs_mcp_bridge"]

[tool.setuptools.package-dir]
"emacs_mcp_bridge" = "src"
